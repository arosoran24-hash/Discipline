<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141417">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.png">
<title>Shared Tracker</title>
<style>
:root{
  --ink:#c9366b;
  --ink2:#e3577f;
  --ink-light:#e59ab5;
  --paper:#fcfaf2;
  --rule:#ccd8ea;
  --margin:#f0b9ca;
  --line:34px;
  --frame:#141417;
  --card:#1f1f24;
  --edge:#2c2c33;
  --txt:#ececf1;
  --mut:#9a9aa3;
}
body.p-nuya{--ink:#6d5ae0;--ink2:#8f7ff0;--ink-light:#b7abf2;--margin:#ccc4f4}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Bradley Hand","Segoe Script","Chalkboard SE","Comic Sans MS",cursive;
  background:var(--frame);
  color:var(--ink);
  display:flex;flex-direction:column;
  overscroll-behavior:none;
}
#top{display:flex;align-items:center;gap:10px;background:var(--frame);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid #202026;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.seg{display:flex;background:#26262b;border-radius:999px;padding:3px}
.seg button{border:none;background:none;color:#9a9aa3;font-weight:700;font-size:13px;padding:7px 16px;border-radius:999px;font-family:inherit;transition:all .25s}
.seg button.on{background:linear-gradient(135deg,var(--ink),var(--ink2));color:#fff}
#sync{margin-left:auto;font-size:11.5px;color:#98989f;text-align:right}
#cfgBtn{border:none;background:none;color:#98989f;font-size:17px;padding:4px 6px}
#panes{flex:1;overflow:hidden;position:relative}
#track{display:flex;width:300%;height:100%;transition:transform .38s cubic-bezier(.22,.61,.36,1);will-change:transform}
.pane{width:33.3333%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
#page{
  background-color:var(--paper);
  background-image:
    linear-gradient(to right,transparent 0,transparent 36px,var(--margin) 36px,var(--margin) 38px,transparent 38px),
    repeating-linear-gradient(to bottom,transparent 0,transparent 33px,var(--rule) 33px,var(--rule) 34px);
  background-attachment:local,local;
  padding:34px 16px 90px 48px;
}
::placeholder{color:var(--ink-light);opacity:.55}
.day-head{display:flex;align-items:center;gap:8px;line-height:var(--line);min-height:var(--line);font-size:23px;margin-bottom:34px}
.day-head .title{flex:1}
#dayNum{width:64px;font:inherit;color:inherit;background:rgba(0,0,0,.05);border:none;border-radius:6px;padding:0 6px;font-size:23px}
.navbtn{flex:0 0 auto;width:34px;height:34px;border:1.5px solid var(--ink-light);border-radius:50%;background:transparent;color:var(--ink);font-family:inherit;font-size:18px;line-height:1}
.navbtn:disabled{opacity:.25}
.item{display:flex;align-items:center;gap:8px;min-height:var(--line);line-height:var(--line);font-size:19px}
.iname{flex:1;min-width:0}
input.iname{font:inherit;font-size:19px;color:inherit;background:rgba(0,0,0,.05);border:none;border-radius:6px;padding:0 6px;line-height:30px}
.mark{flex:0 0 auto;min-width:74px;text-align:right;font-family:inherit;font-size:19px;color:var(--ink);background:none;border:none;padding:0 0 0 8px;letter-spacing:1px;line-height:var(--line)}
.del{display:none;flex:0 0 auto;font-family:inherit;font-size:17px;color:var(--ink);background:none;border:none;padding:0 4px}
.editing .del{display:block}
.addrow{display:none;align-items:center;gap:8px;min-height:var(--line);margin-top:4px}
.editing .addrow{display:flex}
.addrow input{flex:1;min-width:0;font:inherit;font-size:18px;color:inherit;background:rgba(0,0,0,.04);border:1.5px dashed var(--ink-light);border-radius:8px;padding:2px 8px}
.addrow button{flex:0 0 auto;font-family:inherit;font-size:16px;color:var(--ink);background:none;border:1.5px dashed var(--ink-light);border-radius:8px;padding:2px 12px}
.divider{display:flex;align-items:center;gap:12px;min-height:var(--line);margin:17px 0;font-size:17px}
.divider .ln{width:52px;border-top:2px solid var(--ink)}
.notes{margin-top:34px}
.nrow{display:flex;align-items:flex-start;gap:10px;min-height:var(--line);line-height:var(--line);font-size:19px}
.nrow label{flex:0 0 auto}
.nrow textarea{flex:1;min-width:0;font:inherit;font-size:19px;line-height:var(--line);color:inherit;background:transparent;border:none;resize:none;overflow:hidden;min-height:var(--line);padding:0;display:block}
.nrow textarea:focus,input.iname:focus,#dayNum:focus,.addrow input:focus{outline:none}
.modern{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(900px 420px at 110% -8%,rgba(140,80,190,.10),#17171b 60%),#17171b;
  color:var(--txt);
  padding:24px 16px 100px;
}
.modern button,.modern input,.modern textarea{font-family:inherit}
.paneTitle{font-size:27px;font-weight:800;letter-spacing:-.02em}
.paneSub{color:var(--mut);font-size:13px;margin-top:3px}
.chips{display:flex;gap:8px;margin:16px 0 14px;flex-wrap:wrap}
.fchip{border:1px solid #2f2f37;background:#1d1d22;color:#a9a9b2;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;transition:all .2s}
.fchip.on{background:linear-gradient(135deg,var(--ink),var(--ink2));border-color:transparent;color:#fff}
.empty{color:#77777f;text-align:center;padding:34px 10px;font-size:14px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.anim .lcard,.anim .gcard{animation:rise .3s cubic-bezier(.22,.61,.36,1) both;animation-delay:calc(var(--i)*24ms)}
.composer{background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:12px 12px 10px;margin-top:16px}
.composer textarea{width:100%;background:transparent;border:none;color:var(--txt);font-size:15px;line-height:1.5;resize:none;overflow:hidden;min-height:44px;outline:none}
.crow{display:flex;justify-content:flex-end;margin-top:8px}
#logAdd,#ngAdd{background:linear-gradient(135deg,var(--ink),var(--ink2));color:#fff;border:none;border-radius:999px;padding:9px 16px;font-weight:700;font-size:13.5px}
.lcard{background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:13px 14px;margin-bottom:10px}
.ltop{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ltime{color:var(--mut);font-size:12px;font-weight:600;flex:1}
.chip{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 9px}
.chip.open{background:rgba(227,87,127,.16);color:#f08bab}
.chip.resolved{background:rgba(52,201,138,.16);color:#4fd9a0}
.chip.cancelled{background:rgba(150,150,160,.16);color:#a2a2ab}
.ltext{font-size:14.5px;line-height:1.5;color:var(--txt)}
.lcard.stc .ltext{color:#8b8b93;text-decoration:line-through;text-decoration-color:rgba(160,160,170,.5)}
.lact{display:flex;gap:8px;margin-top:11px}
.lbtn{border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;border:1px solid #34343c;background:#26262c;color:#c9c9d1}
.lbtn.res{border-color:rgba(52,201,138,.4);color:#4fd9a0}
.lbtn.can{border-color:rgba(224,86,86,.35);color:#e08585}
.lbtn.ghost{color:var(--mut)}
.ldel,.gdel{background:none;border:none;color:#8a8a93;font-size:15px;padding:2px 6px}
.prow{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 7px;font-size:13px;color:var(--mut)}
#goalProg{font-weight:700;color:var(--txt)}
.pbar{height:8px;background:#26262c;border-radius:99px;overflow:hidden}
.pfill{height:100%;width:0;background:linear-gradient(90deg,var(--ink),var(--ink2));border-radius:99px;transition:width .5s cubic-bezier(.22,.61,.36,1)}
.gcard{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:13px 14px;margin-bottom:10px}
.gcheck{flex:0 0 26px;width:26px;height:26px;margin-top:1px;border-radius:50%;border:2px solid #3f3f49;background:transparent;color:#fff;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;transition:all .2s}
.gcard.done .gcheck{background:linear-gradient(135deg,var(--ink),var(--ink2));border-color:transparent}
.gbody{flex:1;min-width:0}
.gtitle{font-weight:650;font-size:15px;line-height:1.35}
.gcard.done .gtitle{color:#7f7f88;text-decoration:line-through;text-decoration-color:rgba(160,160,170,.5)}
.gnote{color:var(--mut);font-size:13px;line-height:1.45;margin-top:3px}
.gcard.done .gnote{color:#6d6d75}
.gedit input{width:100%;background:#26262c;border:1px solid #34343c;color:var(--txt);border-radius:8px;padding:7px 9px;font-size:14px;margin-bottom:6px;outline:none}
.addgoal{background:var(--card);border:1px dashed #3a3a44;border-radius:16px;padding:12px;margin-top:4px}
.addgoal input{width:100%;background:#26262c;border:1px solid #34343c;color:var(--txt);border-radius:8px;padding:8px 10px;font-size:14px;margin-bottom:8px;outline:none}
#bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--frame);padding:9px 14px;border-top:1px solid #202026}
#bar button{font-family:inherit;font-size:15px;color:#f2d7e2;background:#26262b;border:1px solid #3a3a41;border-radius:999px;padding:8px 15px}
#bar button.primary{background:var(--ink);border-color:var(--ink);color:#fff}
#status{margin-left:auto;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:11.5px;color:#98989f;text-align:right}
.tabs{position:relative;display:flex;background:var(--frame);padding:6px 10px calc(10px + env(safe-area-inset-bottom))}
#tabPill{position:absolute;top:6px;bottom:calc(10px + env(safe-area-inset-bottom));left:10px;width:calc((100% - 20px)/3);background:linear-gradient(135deg,var(--ink),var(--ink2));border-radius:999px;transition:transform .35s cubic-bezier(.22,.61,.36,1)}
.tab{position:relative;z-index:1;flex:1;background:none;border:none;color:#8f8f98;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:700;font-size:13px;padding:10px 0;transition:color .25s}
.tab.active{color:#fff}
#setup{position:fixed;inset:0;background:rgba(10,10,12,.75);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#setup.hidden{display:none}
.scard{background:#1f1f24;border:1px solid #2c2c33;border-radius:20px;padding:20px;max-width:340px;width:100%;color:var(--txt)}
.scard h2{font-size:18px;margin-bottom:4px}
.scard p{font-size:12.5px;color:var(--mut);margin-bottom:12px;line-height:1.5}
.scard label{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.scard input{width:100%;background:#26262c;border:1px solid #34343c;color:var(--txt);border-radius:8px;padding:9px 10px;font-size:14px;margin:4px 0 12px;outline:none}
.srow{display:flex;gap:8px;justify-content:flex-end}
.sbtn{border-radius:999px;padding:9px 16px;font-weight:700;font-size:13px;border:1px solid #34343c;background:#26262c;color:#c9c9d1}
.sbtn.go{background:linear-gradient(135deg,var(--ink),var(--ink2));border:none;color:#fff}
#serr{color:#e08585;font-size:12px;margin-bottom:8px;min-height:14px}
</style>
</head>
<body>
<div id="top">
  <div class="seg" id="pswitch">
    <button data-p="aro" class="on">Aro</button>
    <button data-p="nuya">Nuya</button>
  </div>
  <span id="sync">not connected</span>
  <button id="cfgBtn" aria-label="sync settings">&#9881;</button>
</div>
<div id="panes"><div id="track">
  <div id="page" class="pane">
    <div class="day-head">
      <button id="prevBtn" class="navbtn">&#8249;</button>
      <div class="title" id="headTitle"></div>
      <button id="nextBtn" class="navbtn">&#8250;</button>
    </div>
    <div id="lists">
      <div id="habits"></div>
      <div class="divider"><span class="ln"></span><span>&#9675;</span><span class="ln"></span><span>&#9675;</span><span class="ln"></span><span>&#9675;</span></div>
      <div id="workouts"></div>
    </div>
    <div class="notes">
      <div class="nrow"><label>Achievement :-</label><textarea id="achievement" rows="1" autocomplete="off" placeholder="..."></textarea></div>
      <div class="nrow"><label>regret :-</label><textarea id="regret" rows="1" autocomplete="off" placeholder="..."></textarea></div>
      <div class="nrow"><label>About my self :-</label><textarea id="about" rows="1" autocomplete="off" placeholder="..."></textarea></div>
      <div class="nrow"><label>progress :-</label><span id="progressVal">0%</span></div>
    </div>
  </div>
  <div id="logPane" class="pane modern">
    <div class="paneTitle">Log book</div>
    <div class="paneSub" id="logSub"></div>
    <div class="composer">
      <textarea id="logInput" rows="1" placeholder="Write a log entry... something to track, then resolve or cancel"></textarea>
      <div class="crow"><button id="logAdd">+ add entry</button></div>
    </div>
    <div class="chips" id="logChips"></div>
    <div id="logList"></div>
  </div>
  <div id="goalsPane" class="pane modern">
    <div class="paneTitle">Goals</div>
    <div class="paneSub" id="goalSub"></div>
    <div class="prow"><span>Progress</span><span id="goalProg">0 / 0</span></div>
    <div class="pbar"><div id="goalFill" class="pfill"></div></div>
    <div class="chips" id="goalChips"></div>
    <div id="goalList"></div>
    <div id="goalAddWrap"></div>
  </div>
</div></div>
<div id="bar">
  <button id="newDayBtn" class="primary">+ new day</button>
  <button id="editBtn">edit</button>
  <button id="saveFileBtn">save file</button>
  <span id="status"></span>
</div>
<div class="tabs">
  <div id="tabPill"></div>
  <button class="tab active" data-tab="0">Daily</button>
  <button class="tab" data-tab="1">Log book</button>
  <button class="tab" data-tab="2">Goals</button>
</div>
<div id="setup" class="hidden">
  <div class="scard">
    <h2>Connect shared storage</h2>
    <p>Data lives in a private GitHub repo you both use. Enter the GitHub username that owns the data repo, the repo name, and the fine-grained token (Contents: read &amp; write on that repo only). Never post the token anywhere public.</p>
    <div id="serr"></div>
    <label>GitHub username</label>
    <input id="sOwner" autocapitalize="none" autocomplete="off">
    <label>Data repo name</label>
    <input id="sRepo" autocapitalize="none" autocomplete="off" placeholder="tracker-data">
    <label>Token</label>
    <input id="sToken" type="password" autocomplete="off">
    <div class="srow">
      <button class="sbtn" id="sSkip">use offline</button>
      <button class="sbtn go" id="sGo">connect</button>
    </div>
  </div>
</div>
<script type="application/json" id="seed">null</script>
<script>
(function(){
'use strict';
var LKEY='tracker-shared-v1',CFGKEY='tracker-shared-cfg-v1',WHOKEY='tracker-shared-who';
var MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function $(s){return document.querySelector(s);}
function uid(){return Math.random().toString(36).slice(2,10);}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmt(iso){var p=iso.split('-');return parseInt(p[2],10)+'/'+parseInt(p[1],10)+'/'+p[0].slice(2);}
function fmtTs(ms){var d=new Date(ms);return d.getDate()+' '+MO[d.getMonth()]+' \u00B7 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function nowHM(){var d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function makeDay(n){return{n:n,date:todayISO(),marks:{},achievement:'',regret:'',about:''};}
function personDefault(name){return{name:name,habits:[],workouts:[],days:[makeDay(1)],logs:[],goals:[],updatedAt:0};}
function defaultState(){return{v:3,people:{aro:personDefault('Aro'),nuya:personDefault('Nuya')}};}
function parse(raw){
  if(!raw)return null;
  try{var o=(typeof raw==='string')?JSON.parse(raw):raw;return(o&&o.people&&o.people.aro&&o.people.nuya)?o:null;}catch(e){return null;}
}
function fixPerson(p,name){
  if(!p)return personDefault(name);
  if(!Array.isArray(p.habits))p.habits=[];
  if(!Array.isArray(p.workouts))p.workouts=[];
  if(!Array.isArray(p.days)||!p.days.length)p.days=[makeDay(1)];
  if(!Array.isArray(p.logs))p.logs=[];
  if(!Array.isArray(p.goals))p.goals=[];
  if(!p.updatedAt)p.updatedAt=0;
  if(!p.name)p.name=name;
  return p;
}
var ARO_GOALS=[
["Book first aid / CPR course at the hospital","Fastest entry in the record book — one weekend, permanent skill · 15/07/2026"],
["Ask the hotel chefs to teach me dish #1 of 5","Free 5-star cooking school + easy reps with staff"],
["Study driving theory now — pass it before 18","So only the wheel remains at 18"],
["Swim laps at the hotel pool","The ocean's calm, indoors"],
["Pick a peak + set a date — solo sunrise summit","Mountains + sunrise + solitude. Photo at the top = record entry"],

["Arabic — keep the streak going","Hardest script, highest hotel value. Already begun — don't break the chain"],

["Read Without Reservations by J.W. Marriott","Root beer stand to global hotel company"],
["Read Four Seasons by Isadore Sharp","The business philosophy behind the luxury service standard"],
["Read Unreasonable Hospitality by Will Guidara","Eleven Madison Park — turning service into unforgettable hospitality"],
["Work every hotel job for a week each","Dishwashing, housekeeping, laundry, night audit, front desk — manage differently forever after"],
["Arrange a summer stage at a world-class property","Target Dubai — Four Seasons, Atlantis, Address. One month inside a top operation."],

["Learn business dining etiquette + hosting","Table manners, seating protocol, hosting dinners where deals close themselves"],
["Build maintenance literacy","HVAC, plumbing, electrical, boilers — enough to know when a contractor is lying"],
["Build contract literacy","Termination clauses, liability, unilateral amendment traps — read any contract yourself"],
["Learn to read floor plans + renovation costs","BOQs, cost per sqm, contractor management — for building hotels, not just running them"],
["Barista-level coffee + tea knowledge","Extraction, beans, proper service — instant credibility with the F&B team"],
["Find a good tailor","Learn what actually fits — you're inspected before you speak"],

'Manager should check on tables in à la carte',

function seedAro(p){
  p.migs=p.migs||{};
  if(p.migs.seed1)return;
  var have={};
  p.goals.forEach(function(g){have[g.title]=true;});
  ARO_GOALS.forEach(function(g){
    if(!have[g[0]]){p.goals.push({id:uid(),title:g[0],note:g[1],done:g[2]===true});}
  });
  if(!p.logs.length){
    var base=Date.now();
    ARO_LOGS.forEach(function(t,i){p.logs.push({id:uid(),text:t,ts:base-i*60000,status:'open'});});
  }
  p.migs.seed1=true;
  p.updatedAt=Date.now();
}
function normalize(s){
  s.people=s.people||{};
  s.people.aro=fixPerson(s.people.aro,'Aro');
  s.people.nuya=fixPerson(s.people.nuya,'Nuya');
  seedAro(s.people.aro);
  return s;
}
function mergeStates(local,remote){
  var out=defaultState(),remoteWon=false,keys=['aro','nuya'];
  normalize(local);normalize(remote);
  for(var i=0;i<keys.length;i++){
    var k=keys[i],l=local.people[k],r=remote.people[k];
    if((r.updatedAt||0)>(l.updatedAt||0)){out.people[k]=r;remoteWon=true;}
    else{out.people[k]=l;}
  }
  return{state:out,remoteWon:remoteWon};
}
function markSym(m){return m==='yes'?'( \u2713 )':m==='no'?'( \u2717 )':'(\u00A0\u00A0\u00A0\u00A0)';}
function b64encode(str){
  var bytes=new TextEncoder().encode(str),bin='';
  for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64decode(b64){
  var bin=atob(String(b64).replace(/\s/g,'')),bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

var state=null,cur=0,editing=false,statusTimer=null;
var who='aro',activeTab=0,logFilter='all',goalFilter='all';
var cfg=null,sha=null,pushTimer=null,syncing=false,pendingRender=false;
try{who=localStorage.getItem(WHOKEY)||'aro';}catch(e){}
if(who!=='aro'&&who!=='nuya')who='aro';
try{cfg=JSON.parse(localStorage.getItem(CFGKEY)||'null');}catch(e){}
function P(){return state.people[who];}

function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify(state));}catch(e){}}
function flash(msg){
  $('#status').textContent=msg;
  clearTimeout(statusTimer);
  statusTimer=setTimeout(function(){$('#status').textContent='saved on this device \u2713';},2000);
}
function touch(){
  P().updatedAt=Date.now();
  saveLocal();
  flash('saved \u2713');
  schedulePush();
}

/* ---------- github sync ---------- */
function apiUrl(){return 'https://api.github.com/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo)+'/contents/data.json';}
function ghHeaders(extra){
  var h={'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json'};
  if(extra){for(var k in extra)h[k]=extra[k];}
  return h;
}
function setSync(mode){
  var el=$('#sync');
  if(!cfg){el.textContent='not connected';return;}
  if(mode==='sync'){el.textContent='syncing\u2026';}
  else if(mode==='ok'){el.textContent='synced \u00B7 '+nowHM();}
  else if(mode==='err'){el.textContent='\u26A0 offline \u2014 will retry';}
}
async function remoteGet(){
  var r=await fetch(apiUrl(),{headers:ghHeaders()});
  if(r.status===404)return null;
  if(!r.ok)throw new Error('HTTP '+r.status);
  var j=await r.json();
  return{data:parse(b64decode(j.content)),sha:j.sha};
}
async function remotePut(){
  var body={message:'tracker sync '+who,content:b64encode(JSON.stringify(state))};
  if(sha)body.sha=sha;
  var r=await fetch(apiUrl(),{method:'PUT',headers:ghHeaders({'Content-Type':'application/json'}),body:JSON.stringify(body),keepalive:true});
  if(r.status===409||r.status===422)return false;
  if(!r.ok)throw new Error('HTTP '+r.status);
  var j=await r.json();
  sha=j.content.sha;
  return true;
}
function requestRender(){
  var ae=document.activeElement;
  var typing=ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA');
  if(typing){pendingRender=true;}
  else{renderAll();}
}
async function adoptRemote(rem){
  sha=rem.sha;
  if(rem.data){
    var res=mergeStates(state,rem.data);
    state=res.state;
    if(res.remoteWon){
      if(cur>=P().days.length)cur=P().days.length-1;
      saveLocal();
      requestRender();
    }
  }
}
async function doPull(){
  if(!cfg||syncing)return;
  syncing=true;setSync('sync');
  try{
    var rem=await remoteGet();
    if(rem){await adoptRemote(rem);}
    else{await remotePut();}
    setSync('ok');
  }catch(e){setSync('err');}
  syncing=false;
}
async function doPush(){
  if(!cfg)return;
  if(syncing){schedulePush();return;}
  syncing=true;setSync('sync');
  try{
    var ok=await remotePut();
    if(!ok){
      var rem=await remoteGet();
      if(rem){await adoptRemote(rem);}
      ok=await remotePut();
    }
    setSync(ok?'ok':'err');
  }catch(e){setSync('err');}
  syncing=false;
}
function schedulePush(){
  if(!cfg)return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(function(){pushTimer=null;doPush();},2500);
}
function flushPush(){
  if(pushTimer){clearTimeout(pushTimer);pushTimer=null;doPush();}
}

/* ---------- setup modal ---------- */
function openSetup(){
  $('#serr').textContent='';
  $('#sOwner').value=cfg?cfg.owner:'';
  $('#sRepo').value=cfg?cfg.repo:'tracker-data';
  $('#sToken').value='';
  $('#setup').classList.remove('hidden');
}
$('#cfgBtn').addEventListener('click',openSetup);
$('#sSkip').addEventListener('click',function(){$('#setup').classList.add('hidden');$('#sToken').value='';setSync('ok');if(!cfg)$('#sync').textContent='offline only';});
$('#sGo').addEventListener('click',async function(){
  var o=$('#sOwner').value.trim(),rp=$('#sRepo').value.trim()||'tracker-data',tk=$('#sToken').value.trim();
  if(!o||!tk){$('#serr').textContent='Username and token are required.';return;}
  cfg={owner:o,repo:rp,token:tk};
  $('#serr').textContent='Checking\u2026';
  try{
    var r=await fetch('https://api.github.com/repos/'+encodeURIComponent(o)+'/'+encodeURIComponent(rp),{headers:ghHeaders()});
    if(r.status===401){cfg=null;$('#serr').textContent='Token rejected \u2014 check it and try again.';return;}
    if(r.status===404){cfg=null;$('#serr').textContent='Repo not found \u2014 check username and repo name (token must have access).';return;}
    if(!r.ok){cfg=null;$('#serr').textContent='GitHub error HTTP '+r.status;return;}
    try{localStorage.setItem(CFGKEY,JSON.stringify(cfg));}catch(e){}
    $('#setup').classList.add('hidden');
    $('#sToken').value='';
    doPull();
  }catch(e){cfg=null;$('#serr').textContent='Network error \u2014 are you online?';}
});

/* ---------- person switch ---------- */
function setWho(p){
  who=p;
  try{localStorage.setItem(WHOKEY,p);}catch(e){}
  document.body.classList.toggle('p-nuya',p==='nuya');
  document.querySelectorAll('#pswitch button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-p')===p);});
  cur=P().days.length-1;
  renderAll();
}
document.querySelectorAll('#pswitch button').forEach(function(b){
  b.addEventListener('click',function(){if(state)setWho(b.getAttribute('data-p'));});
});

/* ---------- daily page ---------- */
function itemRow(it,d){
  var nm=editing?'<input class="iname" data-id="'+it.id+'" value="'+esc(it.name)+'">':'<span class="iname">'+esc(it.name)+'</span>';
  var del=editing?'<button class="del" data-id="'+it.id+'">\u2715</button>':'';
  return '<div class="item">'+nm+'<button class="mark" data-id="'+it.id+'">'+markSym(d.marks[it.id])+'</button>'+del+'</div>';
}
function addRow(sec){return '<div class="addrow"><input placeholder="new task" data-add="'+sec+'"><button data-addbtn="'+sec+'">+ add</button></div>';}
function renderHead(){
  var d=P().days[cur];
  var n=editing?'<input id="dayNum" type="number" min="1" value="'+d.n+'">':'<span>'+d.n+'</span>';
  $('#headTitle').innerHTML=esc(P().name)+' \u00B7 day '+n+' \u2014 ('+fmt(d.date)+')';
  $('#prevBtn').disabled=cur<=0;
  $('#nextBtn').disabled=cur>=P().days.length-1;
}
function renderProgress(){
  var d=P().days[cur];
  var items=P().habits.concat(P().workouts),yes=0;
  for(var i=0;i<items.length;i++){if(d.marks[items[i].id]==='yes')yes++;}
  $('#progressVal').textContent=(items.length?Math.round(yes/items.length*100):0)+'%';
}
function autoGrow(el){if(!el)return;el.style.height='auto';el.style.height=el.scrollHeight+'px';}
function render(){
  var d=P().days[cur];
  renderHead();
  $('#habits').innerHTML=P().habits.map(function(it){return itemRow(it,d);}).join('')+addRow('habits');
  $('#workouts').innerHTML=P().workouts.map(function(it){return itemRow(it,d);}).join('')+addRow('workouts');
  if(!editing&&!P().habits.length&&!P().workouts.length){$('#habits').innerHTML='<div class="item" style="opacity:.55">tap edit below to add your daily tasks</div>';}
  $('#achievement').value=d.achievement||'';
  $('#regret').value=d.regret||'';
  $('#about').value=d.about||'';
  ['achievement','regret','about'].forEach(function(k){autoGrow($('#'+k));});
  renderProgress();
}
function addItem(sec,inp){
  var v=inp.value.trim();if(!v)return;
  P()[sec].push({id:uid(),name:v});
  render();touch();
}
function delItem(id){
  P().habits=P().habits.filter(function(i){return i.id!==id;});
  P().workouts=P().workouts.filter(function(i){return i.id!==id;});
  P().days.forEach(function(d){delete d.marks[id];});
  render();touch();
}
function findItem(id){
  var i,p=P();
  for(i=0;i<p.habits.length;i++){if(p.habits[i].id===id)return p.habits[i];}
  for(i=0;i<p.workouts.length;i++){if(p.workouts[i].id===id)return p.workouts[i];}
  return null;
}

/* ---------- log book ---------- */
function chipRow(defs,current,attr){
  return defs.map(function(c){return '<button class="fchip'+(current===c[0]?' on':'')+'" data-'+attr+'="'+c[0]+'">'+c[1]+'</button>';}).join('');
}
function findLog(id){var L=P().logs;for(var i=0;i<L.length;i++){if(L[i].id===id)return L[i];}return null;}
function renderLog(anim){
  if(!state)return;
  $('#logSub').textContent=P().name+"'s log \u2014 mark each entry resolved or cancelled.";
  var all=P().logs.slice().sort(function(a,b){return b.ts-a.ts;});
  var c={all:all.length,open:0,resolved:0,cancelled:0};
  all.forEach(function(l){c[l.status]=(c[l.status]||0)+1;});
  $('#logChips').innerHTML=chipRow([['all','All '+c.all],['open','Open '+c.open],['resolved','Resolved '+c.resolved],['cancelled','Cancelled '+c.cancelled]],logFilter,'lf');
  var list=all.filter(function(l){return logFilter==='all'||l.status===logFilter;});
  var el=$('#logList');
  el.classList[anim?'add':'remove']('anim');
  if(!list.length){
    el.innerHTML='<div class="empty">'+(all.length?'Nothing under this filter.':'No entries yet \u2014 write the first one above.')+'</div>';
    return;
  }
  el.innerHTML=list.map(function(l,i){
    var del=editing?'<button class="ldel" data-ldel="'+l.id+'">\u2715</button>':'';
    var act=l.status==='open'
      ?'<div class="lact"><button class="lbtn res" data-lres="'+l.id+'">\u2713 resolved</button><button class="lbtn can" data-lcan="'+l.id+'">\u2715 cancelled</button></div>'
      :'<div class="lact"><button class="lbtn ghost" data-lre="'+l.id+'">reopen</button></div>';
    return '<div class="lcard'+(l.status==='cancelled'?' stc':'')+'" style="--i:'+Math.min(i,14)+'">'+
      '<div class="ltop"><span class="ltime">'+fmtTs(l.ts)+'</span><span class="chip '+l.status+'">'+l.status+'</span>'+del+'</div>'+
      '<div class="ltext">'+esc(l.text).replace(/\n/g,'<br>')+'</div>'+act+'</div>';
  }).join('');
}

/* ---------- goals ---------- */
function findGoal(id){var G=P().goals;for(var i=0;i<G.length;i++){if(G[i].id===id)return G[i];}return null;}
function renderGoals(anim){
  if(!state)return;
  $('#goalSub').textContent=P().name+"'s long game \u2014 tick them off as they fall.";
  var G=P().goals,total=G.length;
  var done=G.filter(function(g){return g.done;}).length;
  $('#goalProg').textContent=done+' / '+total;
  $('#goalFill').style.width=(total?Math.round(done/total*100):0)+'%';
  $('#goalChips').innerHTML=chipRow([['all','All '+total],['active','Active '+(total-done)],['done','Done '+done]],goalFilter,'gf');
  var list=G.filter(function(g){
    if(goalFilter==='active')return !g.done;
    if(goalFilter==='done')return g.done;
    return true;
  });
  var el=$('#goalList');
  el.classList[anim?'add':'remove']('anim');
  if(!list.length){
    el.innerHTML='<div class="empty">'+(total?'Nothing under this filter.':'No goals yet \u2014 tap edit to add some.')+'</div>';
  }else{
    el.innerHTML=list.map(function(g,i){
      if(editing){
        return '<div class="gcard gedit" style="--i:'+Math.min(i,14)+'"><div class="gbody">'+
          '<input data-getitle="'+g.id+'" value="'+esc(g.title)+'" placeholder="goal title">'+
          '<input data-genote="'+g.id+'" value="'+esc(g.note||'')+'" placeholder="note">'+
          '</div><button class="gdel" data-gdel="'+g.id+'">\u2715</button></div>';
      }
      return '<div class="gcard'+(g.done?' done':'')+'" style="--i:'+Math.min(i,14)+'">'+
        '<button class="gcheck" data-gt="'+g.id+'">'+(g.done?'\u2713':'')+'</button>'+
        '<div class="gbody"><div class="gtitle">'+esc(g.title)+'</div>'+
        (g.note?'<div class="gnote">'+esc(g.note)+'</div>':'')+'</div></div>';
    }).join('');
  }
  $('#goalAddWrap').innerHTML=editing
    ?'<div class="addgoal"><input id="ngTitle" placeholder="goal title"><input id="ngNote" placeholder="note (optional)"><div class="crow"><button id="ngAdd">+ add goal</button></div></div>'
    :'';
}
function renderAll(){pendingRender=false;render();renderLog(false);renderGoals(false);}

/* ---------- tabs ---------- */
function setTab(i){
  activeTab=i;
  $('#track').style.transform='translateX(-'+(i*100/3)+'%)';
  $('#tabPill').style.transform='translateX('+(i*100)+'%)';
  document.querySelectorAll('.tab').forEach(function(t,ix){t.classList.toggle('active',ix===i);});
  $('#newDayBtn').style.display=(i===0)?'':'none';
  if(state){
    if(pendingRender)renderAll();
    if(i===1)renderLog(true);
    if(i===2)renderGoals(true);
  }
}
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click',function(){setTab(parseInt(t.getAttribute('data-tab'),10));});
});

/* ---------- events ---------- */
$('#lists').addEventListener('click',function(e){
  if(!state)return;
  var t=e.target;
  if(t.classList.contains('mark')){
    var id=t.getAttribute('data-id'),d=P().days[cur],m=d.marks[id];
    var nv=m==='yes'?'no':(m==='no'?'':'yes');
    if(nv){d.marks[id]=nv;}else{delete d.marks[id];}
    t.textContent=markSym(d.marks[id]);
    renderProgress();touch();
  }else if(t.classList.contains('del')){delItem(t.getAttribute('data-id'));}
  else if(t.hasAttribute('data-addbtn')){addItem(t.getAttribute('data-addbtn'),t.previousElementSibling);}
});
$('#lists').addEventListener('input',function(e){
  if(!state)return;
  var t=e.target;
  if(t.classList.contains('iname')){
    var it=findItem(t.getAttribute('data-id'));
    if(it){it.name=t.value;touch();}
  }
});
$('#lists').addEventListener('keydown',function(e){
  if(!state)return;
  if(e.key==='Enter'&&e.target.hasAttribute('data-add')){addItem(e.target.getAttribute('data-add'),e.target);}
});
['achievement','regret','about'].forEach(function(k){
  $('#'+k).addEventListener('input',function(e){
    if(!state)return;
    P().days[cur][k]=e.target.value;autoGrow(e.target);touch();
  });
});
window.addEventListener('resize',function(){
  ['achievement','regret','about'].forEach(function(k){autoGrow($('#'+k));});
  autoGrow($('#logInput'));
});
document.addEventListener('focusout',function(){setTimeout(function(){if(pendingRender&&state){var ae=document.activeElement;if(!ae||(ae.tagName!=='INPUT'&&ae.tagName!=='TEXTAREA'))renderAll();}},80);});
$('#headTitle').addEventListener('input',function(e){
  if(!state)return;
  if(e.target.id==='dayNum'){var v=parseInt(e.target.value,10);if(v>0){P().days[cur].n=v;touch();}}
});
$('#prevBtn').addEventListener('click',function(){if(state&&cur>0){cur--;render();}});
$('#nextBtn').addEventListener('click',function(){if(state&&cur<P().days.length-1){cur++;render();}});
$('#newDayBtn').addEventListener('click',function(){
  if(!state)return;
  var days=P().days,last=days[days.length-1];
  days.push(makeDay(last.n+1));
  cur=days.length-1;
  render();touch();
  $('#page').scrollTop=0;
});
$('#logInput').addEventListener('input',function(e){autoGrow(e.target);});
$('#logPane').addEventListener('click',function(e){
  if(!state)return;
  var t=e.target,id;
  if(t.id==='logAdd'){
    var inp=$('#logInput'),v=inp.value.trim();
    if(!v)return;
    P().logs.push({id:uid(),text:v,ts:Date.now(),status:'open'});
    inp.value='';autoGrow(inp);
    renderLog(false);touch();
  }else if(t.hasAttribute('data-lf')){logFilter=t.getAttribute('data-lf');renderLog(true);}
  else if(t.hasAttribute('data-lres')){id=t.getAttribute('data-lres');var a=findLog(id);if(a){a.status='resolved';renderLog(false);touch();}}
  else if(t.hasAttribute('data-lcan')){id=t.getAttribute('data-lcan');var b=findLog(id);if(b){b.status='cancelled';renderLog(false);touch();}}
  else if(t.hasAttribute('data-lre')){id=t.getAttribute('data-lre');var g=findLog(id);if(g){g.status='open';renderLog(false);touch();}}
  else if(t.hasAttribute('data-ldel')){
    id=t.getAttribute('data-ldel');
    P().logs=P().logs.filter(function(l){return l.id!==id;});
    renderLog(false);touch();
  }
});
$('#goalsPane').addEventListener('click',function(e){
  if(!state)return;
  var t=e.target,id;
  if(t.hasAttribute('data-gf')){goalFilter=t.getAttribute('data-gf');renderGoals(true);}
  else if(t.hasAttribute('data-gt')){id=t.getAttribute('data-gt');var g=findGoal(id);if(g){g.done=!g.done;renderGoals(false);touch();}}
  else if(t.hasAttribute('data-gdel')){
    id=t.getAttribute('data-gdel');
    P().goals=P().goals.filter(function(x){return x.id!==id;});
    renderGoals(false);touch();
  }else if(t.id==='ngAdd'){
    var ti=$('#ngTitle').value.trim();if(!ti)return;
    P().goals.push({id:uid(),title:ti,note:$('#ngNote').value.trim(),done:false});
    renderGoals(false);touch();
  }
});
$('#goalsPane').addEventListener('input',function(e){
  if(!state)return;
  var t=e.target,g;
  if(t.hasAttribute('data-getitle')){g=findGoal(t.getAttribute('data-getitle'));if(g){g.title=t.value;touch();}}
  else if(t.hasAttribute('data-genote')){g=findGoal(t.getAttribute('data-genote'));if(g){g.note=t.value;touch();}}
});
$('#editBtn').addEventListener('click',function(){
  if(!state)return;
  editing=!editing;
  document.body.classList.toggle('editing',editing);
  this.textContent=editing?'done':'edit';
  renderAll();
});
$('#saveFileBtn').addEventListener('click',function(){
  if(!state)return;
  try{
    document.getElementById('seed').textContent=JSON.stringify(state).replace(/</g,'\\u003c');
    var html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
    var blob=new Blob([html],{type:'text/html'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download='shared-tracker-backup.html';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},3000);
    flash('backup downloaded \u2713');
  }catch(e){flash('\u26A0 could not save a file here');}
});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='hidden'){flushPush();}
  else if(document.visibilityState==='visible'&&state){doPull();}
});
window.addEventListener('pagehide',flushPush);

/* ---------- boot ---------- */
(function boot(){
  var stored=null;
  try{stored=parse(localStorage.getItem(LKEY));}catch(e){}
  var seed=parse(document.getElementById('seed').textContent);
  state=normalize(stored||seed||defaultState());
  cur=P().days.length-1;
  setWho(who);
  $('#status').textContent='saved on this device \u2713';
  if(cfg){doPull();setInterval(function(){if(!pushTimer)doPull();},45000);}
  else{openSetup();$('#sync').textContent='not connected';}
})();
})();
</script>
